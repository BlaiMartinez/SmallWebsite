<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the public GitHub repositories for any username.">
  <title>GitHub Repository Browser</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <header class="mb-4">
        <h1 class="h2">GitHub Repository Browser</h1>
        <p class="text-body-secondary mb-0">Enter a GitHub username to browse their public repositories.</p>
      </header>

      <form id="search-form" class="card card-body shadow-sm mb-4">
        <label for="username" class="form-label">GitHub username</label>
        <div class="input-group">
          <span class="input-group-text" aria-hidden="true">@</span>
          <input id="username" class="form-control" type="text" placeholder="octocat" autocomplete="off" required>
          <button id="search-button" class="btn btn-primary" type="submit">Find repositories</button>
        </div>
      </form>

      <div id="status" class="mb-3" role="status" aria-live="polite"></div>

      <section id="results" class="card shadow-sm d-none" aria-label="Repositories">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h2 id="results-heading" class="h5 mb-0">Repositories</h2>
          <span id="repo-count" class="badge text-bg-secondary"></span>
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-light">
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Description</th>
              <th scope="col" class="text-nowrap">Followers / stars</th>
            </tr>
            </thead>
            <tbody id="repository-list"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  $(function () {
    const $form = $("#search-form");
    const $username = $("#username");
    const $button = $("#search-button");
    const $status = $("#status");
    const $results = $("#results");
    const $list = $("#repos-list");
    const $count = $("#repos-count");
    const $heading = $("#results-heading");

    function nextPage(linkHeader) {
      if (!linkHeader) return null;
      const links = linkHeader.split(",");
      for (const link of links) {
        const match = link.match(/<([^>]+)>;\s*rel="next"/);
        if (match) return match[1];
      }
      return null;
    }

    function addRepositories(repositories) {
      repositories.forEach(function (repository) {
        const $row = $("<tr>");
        const $nameCell = $("<th>", { scope: "row" });
        const $link = $("<a>", {
          href: repository.html_url,
          target: "_blank",
          rel: "noopener noreferrer"
        }).text(repository.name);

        $nameCell.append($link);
        $row.append($nameCell);
        $row.append($("<td>").text(repository.description || "No description provided."));
        $row.append($("<td>", { class: "text-center" }).text(repository.stargazers_count));
        $list.append($row);
      });
    }

    $form.on("submit", function (event) {
      event.preventDefault();
      const username = $username.val().trim();
      if (!username) return;

      $button.prop("disabled", true);
      $status.empty().append(
              $("<div>", { class: "alert alert-info mb-0" }).text("Loading repositories for @" + username + "…")
      );
      $results.addClass("d-none");
      $list.empty();
      $count.empty();

      let total = 0;

      function loadPage(url) {
        $.ajax({ url: url, dataType: "json" })
                .done(function (repositories, _textStatus, xhr) {
                  addRepositories(repositories);
                  total += repositories.length;
                  const next = nextPage(xhr.getResponseHeader("Link"));
                  if (next) {
                    loadPage(next);
                    return;
                  }

                  $heading.text("Repositories for @" + username);
                  $count.text(total);
                  $results.removeClass("d-none");
                  $status.empty().append(
                          $("<div>", { class: "alert alert-success mb-0" }).text(
                                  total === 0 ? "This user has no public repositories." : "Repositories loaded."
                          )
                  );
                  $button.prop("disabled", false);
                })
                .fail(function (xhr) {
                  let message = "Could not load repositories. Please try again.";
                  if (xhr.status === 404) {
                    message = "GitHub user @" + username + " was not found.";
                  } else if (xhr.status === 403) {
                    message = "GitHub's API rate limit was reached. Please try again later.";
                  }
                  $status.empty().append($("<div>", { class: "alert alert-danger mb-0" }).text(message));
                  $results.addClass("d-none");
                  $button.prop("disabled", false);
                });
      }

      loadPage("https://api.github.com/users/" + encodeURIComponent(username) + "/repos?per_page=100&sort=updated");
    });
  });
</script>
</body>
</html>
